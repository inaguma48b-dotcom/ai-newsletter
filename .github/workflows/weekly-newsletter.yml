name: Weekly AI Newsletter

on:
  schedule:
    - cron: "0 22 * * 0"
  workflow_dispatch:
    inputs:
      skip_research:
        description: "リサーチを飛ばして現在の content.md をそのまま配信する"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: AI情報を収集して content.md を生成
        if: ${{ inputs.skip_research != true }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python research.py

      - name: ニュースレター送信
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
        run: python newsletter.py

      - name: 本文とバックナンバーをコミット
        run: |
          git config user.name "newsletter-bot"
          git config user.email "actions@github.com"
          git add content.md archive/
          git diff --cached --quiet || git commit -m "newsletter: $(TZ=Asia/Tokyo date +%Y-%m-%d) 号を配信"
          git push
